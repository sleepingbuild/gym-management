name: CI

on:
push:
branches:
- main
pull_request:

jobs:
backend:
runs-on: ubuntu-latest
defaults:
run:
working-directory: backend

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Install dependencies
    run: npm install

  - name: Run ESLint
    run: npm run lint

  - name: Build backend
    run: npm run build
```

frontend:
runs-on: ubuntu-latest
defaults:
run:
working-directory: frontend

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Install dependencies
    run: npm install

  - name: Build frontend
    run: npm run build
```
